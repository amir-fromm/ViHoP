input:
  # sample_id <TAB> fastq_dir[,fastq_dir2,...]  — comma = multiple runs merged by Cell Ranger
  sample_table: docs/sample_table_fastq.tsv
  # Which samples to run through Cell Ranger. null / omit = all rows in sample_table.
  # Paths come from docs/sample_table_fastq.tsv (Eilat_10X_* have multi-run commas).
  # From Alps_All_MetaG pairing.config FASTQDIR (space = separate samples).
  samples:
    - Alps_Amir   # single folder (active FASTQDIR)
    - Alps2       # commented FASTQDIR
    - Alps5

references:
  # Parent of <sample>/outs/...  null / omit = results/cellranger (under workdir).
  # Override: config value or ./vihop --bam-root /path/to/CR_outs
  bam_root: null

  # Raw gene set for Cell Ranger reference build (cluster path for
  # smb://data.wexac.weizmann.ac.il/vardi/Collaboration/databases/Gossenkollesee/...).
  transcriptome_fasta: /home/labs/vardi/Collaboration/databases/Gossenkollesee/combined_genemark_metaeuk_genes_dedup.fasta
  cellranger_transcriptome_fasta: /home/labs/vardi/Collaboration/databases/Gossenkollesee/combined_genemark_metaeuk_genes_dedup.fasta
  cellranger_ref_name: Gossenkollesee_CR
  pr2_fasta: /home/labs/vardi/Collaboration/databases/pr2/pr2_version_5.0.0_dedup.fasta
  pr2_db: /home/labs/vardi/Collaboration/databases/pr2/pr2_v5
  metapr2_db: /home/labs/vardi/Collaboration/databases/pr2/metapr2_v2
  virus_db_fasta: /home/labs/vardi/Collaboration/databases/GVDB/GVDB_markergenes/GVDB.markergenes_prot.faa
  general_diamond_db: /home/labs/vardi/Collaboration/databases/Aylward_DB_2024/refSeq223_Virus_appended_masked_lin.dmnd
  refseq_catalog: /home/labs/vardi/Collaboration/databases/refseq/RefSeq-release223.taxid.catalog
  refseq_nodes: /home/labs/vardi/Collaboration/databases/refseq/nodes.short.dmp
  refseq_merged: /home/labs/vardi/Collaboration/databases/refseq/merged.edited.dmp
  diamond_bin: /home/labs/vardi/amirz/miniconda3/bin/diamond
  virus_taxonomy: /home/labs/vardi/Collaboration/databases/Aylward_DB_2024/0626_GV_Mirus_GKS_taxonomic_classification.csv

taxonomy:
  replacement_file: docs/replacement_taxa.tsv
  level: Class

params:
  # Stage toggles for incremental migration / testing.
  stages:
    reference: false   # already built for Gossenkollesee_CR
    cellranger: false
    choose_cells: true
    downstream: false
    virus_search: false  # or ./vihop --virus_search (needs barrnap batches)
  cellranger:
    threads: 16
    # Module name for `module load` (empty → CellRanger/9.0.0 fallback).
    module: ""
    # --localmem GB; empty/null → derive from resources.cellranger.mem_mb
    localmem_gb: null
    # --localvmem GB; empty/null → omit
    localvmem_gb: null
    # Martian --overrides JSON path; empty → omit (see config/cellranger_align_mem_huge.json)
    overrides_json: ""
    # true → wipe sample pipestance before count; false → resume (default)
    force_clean: false
    # --- advanced configuration (optional) ---
    # create_bam: true/false — BAM needed for ViHoP extraction; keep true unless you know otherwise
    create_bam: true
    # chemistry: auto, or null to omit
    chemistry: auto
    # expect_cells: integer, or null to omit (Cell Ranger auto-estimates)
    expect_cells: null
  reference:
    # Exactly one of: cdhit | mmseqs | none
    # none = FASTA already deduplicated (copy/link through; still runs clean→gtf→mkref)
    dedup_method: mmseqs
    dedup_identity: 0.95
    mmseqs:
      coverage: 0.30
      cov_mode: 1
      min_aln_len: 200
      threads: 32
    cdhit:
      threads: 48
    mkref_threads: 16
  choose_cells:
    # Default null = all barcodes from filtered_feature_bc_matrix.
    # Set integers to require min UMIs / genes detected per cell.
    min_umi: null
    min_genes: null

  extraction:
    threads: 2
  assembly:
    # Cells per LSF job. threads = how many SPAdes run at once inside that job.
    cells_per_batch: 200
    threads: 4
  aggregation:
    entropy: 0.7
    threads: 4
  host:
    # 18S only. Virus DIAMOND searches the combined transcripts, including shorter ones.
    contig_length: 300
    blast_evalue: "1e-10"
    blast_threads: 8
    # cmsearch threads. 4 fits in 16 GB. Use 32 or 64 if the cluster allows
    # the auto-scaled RAM (threads × barrnap_mem_mb_per_thread).
    barrnap_threads: 4
    # How many pieces to cut transcripts into (filtered for Barrnap, full for virus).
    split_fasta: 40
    # barrnap 1.x renamed euk -> fun; underlying model is still Rfam SSU_rRNA_eukarya.
    barrnap_kingdom: fun
    blast_identity: 99
    blast_length: 300
    # A real genus wins over a placeholder (*_X, Unknown diatom) even when the
    # placeholder has a higher bitscore. Placeholder contigs are then dropped
    # on cells that have a real genus. Set false to keep the highest bitscore.
    force_annotation: true
    blast_prefilter_pident: 90
    blast_prefilter_length: 100
    chimeric_percent: 80
    summary_threads: 4
  virus:
    identity: 70
    length: 30

# Scheduler names for the lsf_queue roles used under resources.
# short: jobs that may be moved off a node. long: jobs that must stay put.
# On another cluster, set these to that site's queue names.
lsf:
  queues:
    short: short
    long: long

resources:
  reference:
    dedup_mem_mb: 64000
    mkref_mem_mb: 64000
    # Scratch for ~1GB transcriptome + mmseqs/mkref intermediates (avoid 200GB PEND).
    disk_mb: 50000
    runtime: 1440
    lsf_queue: short
  cellranger:
    mem_mb: 64000
    disk_mb: 100000
    # Must stay within LSF short-queue hard RUNLIMIT (2880 was rejected).
    runtime: 1440
    lsf_queue: short
  choose_cells:
    mem_mb: 8000
    disk_mb: 8000
    runtime: 120
    lsf_queue: short
  extraction:
    # One gzip writer per candidate cell; scale with cell count (2GB OOMs on ~10k cells).
    mem_mb: 64000
    disk_mb: 100000
    runtime: 1440
    lsf_queue: short
  assembly:
    # 4 SPAdes at once, ~1 GB each (observed max ~370 MB).
    mem_mb: 4000
    disk_mb: 4000
    runtime: 240
    lsf_queue: short
  aggregation:
    # BBDuk heap is capped under this reservation.
    mem_mb: 8000
    disk_mb: 8000
    runtime: 120
    lsf_queue: short
  host:
    # Modest defaults for test/small queries; raise for large production runs.
    # cmsearch on a batch exceeds 4 GB (LSF TERM_MEMLIMIT at the cap).
    # Floor for Barrnap. Actual job RAM is max(this, threads × per_thread).
    barrnap_mem_mb: 16000
    barrnap_mem_mb_per_thread: 3000
    blast_mem_mb: 8000
    summary_mem_mb: 4000
    disk_mb: 8000
    # Short queue preempts cmsearch and blastn mid-run.
    runtime: 720
    lsf_queue: long
  virus:
    # DIAMOND very-sensitive blastx. Peak RSS ~5218 MB → keep total ≥ ~12 GB.
    # LSF: -n cpus == span[ptile=cpus], rusage[mem=memory_per_slot].
    # Long queue: short can preempt mid-blastx (~1h) under high fan-out.
    cpus: 16
    memory_per_slot: 750
    summary_mem_mb: 4000
    disk_mb: 50000
    runtime: 720
    lsf_queue: long

outputs:
  candidate_cells: results/candidate_cells.tsv
  cells_dir: results/cells
  # Cell Ranger transcriptome (mkref) for the configured ref name.
  cellranger_ref: results/ref/Gossenkollesee_CR/Gossenkollesee_CR
  cellranger_ref_done: results/ref/Gossenkollesee_CR/mkref.done
  combined_transcripts: results/assembly/all_cells.transcripts.final.fasta
  rrna_18s: results/host/18S.rrna.fasta
  blast_pr2: results/host/all_cells.rRNA.PR2.tsv
  blast_metapr2: results/host/all_cells.rRNA.metaPR2.tsv
  # blast_summary, summarized_annotation, and summary_blast_viruses
  # are named from taxonomy.level.
  viral_contigs: results/virus/summary_diamond_viruses.tsv
